<!doctype html>
<html lang="id">

<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width,initial-scale=1">
    <title>Laporan | VokaBook</title>
    <link rel="stylesheet" href="css/style.css">
</head>

<body>
    <div id="nav"></div>
    <main class="container">
        <header class="page-head">
            <div><small>RINGKASAN TOKO</small>
                <h1>Laporan Pemesanan</h1>
                <p class="muted">Pantau pesanan pelanggan dan ubah statusnya.</p>
            </div><a class="btn primary" href="checkout.html">＋ Pesanan baru</a>
        </header>
        <section class="stats">
            <article><small>Total pesanan</small><strong id="reportCount">0</strong></article>
            <article><small>Nilai pesanan</small><strong id="reportValue">Rp 0</strong></article>
            <article><small>Belum selesai</small><strong id="reportActive">0</strong></article>
        </section>
        <section class="panel">
            <div class="toolbar"><input id="reportSearch" placeholder="Cari nama atau nomor DO…"><select
                    id="reportFilter">
                    <option value="">Semua status</option>
                    <option>Menunggu</option>
                    <option>Dalam Perjalanan</option>
                    <option>Dikirim</option>
                    <option>Selesai</option>
                </select></div>
            <div class="table-wrap">
                <table>
                    <thead>
                        <tr>
                            <th>No. DO</th>
                            <th>Nama</th>
                            <th>Tanggal</th>
                            <th>Total</th>
                            <th>Status</th>
                            <th>Detail</th>
                        </tr>
                    </thead>
                    <tbody id="reportRows"></tbody>
                </table>
            </div>
        </section>
    </main>
    <script src="js/data.js"></script>
    <script src="js/app.js"></script>
</body>

</html>
